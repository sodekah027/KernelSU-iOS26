name: Build KernelSU iOS26 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      
    - name: ☕ Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: 🔧 Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: 🔍 Check Gradle version
      run: ./gradlew --version
    
    - name: 🧹 Clean build
      run: ./gradlew clean
    
    - name: 🏗️ Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --info
      env:
        GRADLE_OPTS: -Xmx4g -XX:+HeapDumpOnOutOfMemoryError
    
    - name: 📦 Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      env:
        GRADLE_OPTS: -Xmx4g -XX:+HeapDumpOnOutOfMemoryError
      continue-on-error: true
    
    - name: 📊 List APK outputs
      run: |
        echo "=== Debug APK ==="
        ls -lah app/build/outputs/apk/debug/ || echo "Debug APK not found"
        echo ""
        echo "=== Release APK ==="
        ls -lah app/build/outputs/apk/release/ || echo "Release APK not found"
    
    - name: ⬆️ Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-iOS26-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
    
    - name: ⬆️ Upload Release APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: KernelSU-iOS26-Release
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: ignore
    
    - name: 📝 Upload Build Logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs
        path: |
          app/build/reports/
          app/build/outputs/logs/
        if-no-files-found: ignore
    
    - name: 💬 Comment APK Info
      if: success()
      run: |
        echo "### ✅ Build Successful! 🎉" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Debug APK:**" >> $GITHUB_STEP_SUMMARY
        DEBUG_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
        echo "- Size: $DEBUG_SIZE" >> $GITHUB_STEP_SUMMARY
        echo "- Download from Artifacts above" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          RELEASE_SIZE=$(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)
          echo "**Release APK:**" >> $GITHUB_STEP_SUMMARY
          echo "- Size: $RELEASE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- Download from Artifacts above" >> $GITHUB_STEP_SUMMARY
        fi
